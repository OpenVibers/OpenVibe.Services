## ═══════════════════════════════════════════════════════════════
## openvibe.services — Nginx configuration (REFERENCE)
##
## Deployed to /etc/nginx/sites-available/openvibe.services.conf — keep them in sync and reload nginx
## after changing it. The Node app (port 4930, systemd unit openvibe-services) serves:
##
##   /api/v1/resources…         the resource index (services.resource.read); every request needs a
##                              Network service token for audience openvibe.services, or a person's
##                              user token scoped to one project they own or belong to
##   /api/health, /api/ready, /release.json
##   /metrics                   Prometheus text, answered only to direct loopback callers (never proxied)
##   /internal/                 host-local service endpoints, refused here
##
## The console (plan T13 step 9) is not served yet: today every other path is a 404 problem+json.
##
## The client address reaches the app as $remote_addr only, same in X-Forwarded-For and CF-Connecting-IP:
## the header is set here, never appended to or passed through from the client, so the app's own view of
## who is calling cannot be spoofed.
##
## No proxy_cache: the index answers no-store (a partial page must never be cached as if it were whole).
## Never log request bodies or the Authorization header: a service token and a person's token both ride
## in one, and the index passes the caller's token to no one but Network (project membership).
## ═══════════════════════════════════════════════════════════════

limit_req_zone $binary_remote_addr zone=ovservices_api:10m rate=20r/s;

# ── HTTP → HTTPS ────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name openvibe.services www.openvibe.services;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://openvibe.services$request_uri; }
}

# ── www → apex ──────────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.openvibe.services;

    ssl_certificate     /etc/letsencrypt/live/openvibe.services/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/openvibe.services/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    return 301 https://openvibe.services$request_uri;
}

# ── The service ─────────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name openvibe.services;

    ssl_certificate     /etc/letsencrypt/live/openvibe.services/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/openvibe.services/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    access_log /var/log/nginx/openvibe.services.access.log;
    error_log  /var/log/nginx/openvibe.services.error.log;

    # The API answers query strings and small JSON bodies only (server/app.js, 64 kB).
    client_max_body_size 1m;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    gzip on;
    gzip_proxied any;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types application/json application/problem+json text/plain;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;          # the client address, from $remote_addr only
    proxy_set_header X-Forwarded-For $remote_addr;    # never appended to, never passed through
    proxy_set_header CF-Connecting-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    # ── Health, readiness, the release manifest ─────────────
    location = /api/health   { proxy_pass http://127.0.0.1:4930; }
    location = /api/ready    { proxy_pass http://127.0.0.1:4930; }
    location = /release.json { proxy_pass http://127.0.0.1:4930; }

    # ── Prometheus metrics: host-local scrapers only (http://127.0.0.1:4930/metrics) ──
    location = /metrics { return 404; }

    # ── Host-local service endpoints ────────────────────────
    location /internal/ { return 404; }

    # ── The resource index ──────────────────────────────────
    # The fan-out is slow by nature (it reads every authority): give it a generous read timeout while
    # the app's own per-authority timeout keeps one slow authority from holding the page (it lands in
    # the page's `partial` array instead).
    location /api/ {
        limit_req zone=ovservices_api burst=40 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:4930;
        proxy_read_timeout 30s;
    }

    # ── Nothing else is served yet (the console is plan T13 step 9) ──
    location / { return 404; }

    location ~ /\.(?!well-known) {
        deny all;
    }
}
