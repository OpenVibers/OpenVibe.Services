## ═══════════════════════════════════════════════════════════════
## openvibe.services — Nginx configuration (REFERENCE)
##
## Deployed to /etc/nginx/sites-available/openvibe.services.conf — keep them in sync and reload nginx
## after changing it. The Node app (port 4930, systemd unit openvibe-services) renders every page and
## answers the API (the console and docs moved here from openvibe.codes on 2026-10-08); nginx terminates
## TLS, redirects www → apex, rate-limits sign-in, forms and API, and compresses text.
##
##   /api/v1/resources…  the merged resource index (services.resource.read): a Network service token for
##                       audience openvibe.services, or a person's token scoped to one project
##   /metrics            Prometheus text, answered only to direct loopback callers (never proxied)
##   /internal/          host-local service endpoints, refused here
##
## The client address reaches the app as $remote_addr only, same in X-Forwarded-For and CF-Connecting-IP:
## the header is set here, never appended to or passed through from the client.
##
## No proxy_cache: the app decides cacheability per response (public only for docs and policy pages
## rendered for anonymous visitors; private, no-store for everything personal, and no-store for the
## one page that shows a new client secret, and for the index). Never log request bodies or the
## Authorization header here: forms carry secrets, and tokens ride in that header.
## ═══════════════════════════════════════════════════════════════

limit_req_zone $binary_remote_addr zone=ovservices_auth:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=ovservices_forms:10m rate=2r/s;
limit_req_zone $binary_remote_addr zone=ovservices_api:10m rate=5r/s;

server {
    listen 80;
    listen [::]:80;
    server_name openvibe.services www.openvibe.services;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://openvibe.services$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.openvibe.services;

    ssl_certificate     /etc/letsencrypt/live/openvibe.services/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/openvibe.services/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    return 301 https://openvibe.services$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name openvibe.services;

    ssl_certificate     /etc/letsencrypt/live/openvibe.services/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/openvibe.services/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    access_log /var/log/nginx/openvibe.services.access.log;
    error_log  /var/log/nginx/openvibe.services.error.log;

    # Playground uploads are at most 1 MB (SERVICES_PLAYGROUND_MAX_UPLOAD_BYTES); forms are small.
    client_max_body_size 2m;

    add_header X-Content-Type-Options nosniff always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    gzip on;
    gzip_proxied any;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript text/javascript application/json application/problem+json application/schema+json image/svg+xml text/plain application/xml;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header CF-Connecting-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    # ── Network SSO session endpoints (strict) ──────────────
    # The session probe: the shared navbar asks it on every page view, so it cannot share the sign-in
    # budget below (10 a minute): a visitor reading quickly was answered 503 and looked signed out
    # (found by the browser check, OpenVibe.Host scripts/browser-check.js).
    location = /auth/me {
        limit_req zone=ovservices_api burst=30 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:4930;
    }

    location /auth/ {
        limit_req zone=ovservices_auth burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:4930;
    }

    # ── API ─────────────────────────────────────────────────
    location /api/ {
        limit_req zone=ovservices_api burst=20 nodelay;
        proxy_pass http://127.0.0.1:4930;
    }

    # ── State-changing forms (projects, releases, tools, staff) ──
    location ~ ^/(projects|releases|tools|manifests|staff) {
        limit_req zone=ovservices_forms burst=20 nodelay;
        proxy_pass http://127.0.0.1:4930;
    }

    # ── Prometheus metrics: host-local scrapers only (http://127.0.0.1:4930/metrics) ──
    location = /metrics { return 404; }
    location /internal/ { return 404; }

    # ── Pages, docs, robots.txt, sitemap, static assets ─────
    location / {
        proxy_pass http://127.0.0.1:4930;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }
}
